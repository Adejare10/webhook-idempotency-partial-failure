[metadata]
name = "webhook-idempotency-partial-failure"
description = "Make a TypeScript payment webhook processor idempotent across duplicate, concurrent, retry, and partial-failure delivery."
version = "1.0.0"

[verifier]
timeout_sec = 300
network_mode = "none"

[agent]
timeout_sec = 14400
network_mode = "none"

[environment]
cpus = 4
memory_mb = 4096
storage_mb = 4096
gpus = 0